name: Update Dependencies

on:
  schedule:
    - timezone: "Asia/Tokyo"
      cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update:
    name: Update uv.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Update all dependencies
        run: uv sync -U

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet uv.lock pyproject.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run tests with updated dependencies
        id: test
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: uv run pytest

      - name: Roll back dependencies
        if: steps.test.outcome == 'failure'
        run: |
          git checkout -- uv.lock pyproject.toml
          uv sync

      - name: Commit and push
        if: steps.test.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add uv.lock pyproject.toml
          git commit -m "chore: update dependencies"
          git push

      - name: Notify Discord
        if: always()
        run: |
          uv run python .github/scripts/notify_discord.py dependencies \
            --status "${{ job.status }}" \
            --branch "${{ github.ref_name }}" \
            --commit-sha "$(git rev-parse HEAD)" \
            --commit-message "$(git log -1 --format=%s)" \
            --commit-timestamp "$(git log -1 --format=%cI)" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --actor "${{ github.actor }}" \
            ${{ steps.diff.outputs.changed != 'true' && '--no-changes' || '' }} \
            ${{ steps.test.outcome == 'failure' && '--rolled-back' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
