name: PR Review (Powered by Copilot)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

env:
  MAX_DIFF_BYTES: 60000

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Set up node
        uses: actions/setup-node@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > pr.diff

          if [ ! -s pr.diff ]; then
            echo "EMPTY_DIFF=true" >> "$GITHUB_ENV"
            exit 0
          fi

          {
            echo 'Review the following unified diff.'
            echo
            echo '```diff'
            head -c "$MAX_DIFF_BYTES" pr.diff
            echo
            echo '```'
          } > prompt.txt

      - name: Run AI review
        id: inference
        if: env.EMPTY_DIFF != 'true'
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        with:
          model: ''
          prompt-file: prompt.txt
          system-prompt: >-
            You are a senior software engineer performing a pull request code review.
            Point out bugs, security issues, readability problems, and missing tests.
            Reply in Japanese using Markdown, with concrete and concise bullet points.
            If no issues are found, say so briefly.

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
        run: |
          if [ "$EMPTY_DIFF" = 'true' ]; then
            echo '差分が検出できませんでした。' > comment.md
          else
            {
              echo '## 🤖 自動コードレビュー (Copilot)'
              echo
              cat "$RESPONSE_FILE"
            } > comment.md
          fi

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
